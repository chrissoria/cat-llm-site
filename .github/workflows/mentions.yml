name: Collect CatLLM mentions

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC, an hour after the stats job
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mentions
        id: fetch
        env:
          # Fine-grained PAT with public-repo read. The built-in GITHUB_TOKEN
          # cannot use the code-search API; without this secret the script
          # skips GitHub and still collects citations and discussions.
          MENTIONS_TOKEN: ${{ secrets.MENTIONS_TOKEN }}
        run: python3 scripts/fetch_mentions.py

      - name: Commit pending candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/mentions-pending.json
          git diff --cached --quiet || git commit -m "chore: new mention candidates [skip ci]"
          git push

      - name: Open a review issue
        if: steps.fetch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.fetch.outputs.summary }}
          COUNT: ${{ steps.fetch.outputs.new_count }}
        run: |
          gh issue create \
            --title "Review $COUNT new CatLLM mention(s)" \
            --label mentions \
            --body "$(cat <<EOF
          Found by \`scripts/fetch_mentions.py\`. **Nothing below is published yet.**

          $SUMMARY

          To publish an entry, move it from \`assets/mentions-pending.json\` into
          \`assets/mentions.json\`. To dismiss one, add its URL to
          \`assets/mentions-rejected.json\` so it is not reported again.

          See \`scripts/README.md\`.
          EOF
          )"
